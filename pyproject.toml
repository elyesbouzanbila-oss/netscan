[project]
name = "random-bs"
version = "0.1.0"
description = "Dependency-free local network inventory scanner for Windows (ICMP + ARP)"
readme = "README.md"
authors = [
    { name = "elyesbouzanbila-oss", email = "elyesbouzanbila@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
random-bs = "random_bs:main"
netscan = "random_bs:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
